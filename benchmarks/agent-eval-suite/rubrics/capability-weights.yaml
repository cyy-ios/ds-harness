# Capability weights.
# Consumer: score aggregation step.
# Base score = weighted average of base_capability_weights.
# Final score = base score * multiplier_capabilities[真实性&可靠性] * multiplier_capabilities[指令遵循].
# Multiplier transform `score_div_100` means capability_score / 100.
# Child weights are recursive: each node's children are normalized among applicable (non-null) scores.

base_capability_weights:
  任务完成度: 15
  项目理解: 10
  用户意图理解: 10
  任务规划: 10
  结果预期: 10
  异常分析能力: 10

multiplier_capabilities:
  真实性&可靠性:
    transform: score_div_100
  指令遵循:
    transform: score_div_100

children_weights:
  真实性&可靠性:
    1.1_信息真实性: 60
    1.2_言行一致性: 40
  遵循:
    持久遵循:
      weight: 50
      children:
        持久规则遵循: 40
        持久流程遵循: 30
        局部持久约束遵循: 30
    单步遵循:
      weight: 50
      children:
        Prompt遵循: 30
        单步流程遵循: 70    
  项目理解:
    维度1_初始主动理解:
      weight: 30
      children:
        1.1_首轮探索深度: 100
        1.2_目的理解: 0
        1.3_子项目识别: 0
        1.5_完成度判断: 0
        1.6_项目类型: 0
    维度2_动态更新:
      weight: 70
      children:
        2.1_环节追踪: 25
        2.2_主支线识别: 25
        2.3_废弃方向识别: 20
        2.4_完成研究中区分: 15
        2.5_无关任务隔离: 15
  用户意图理解:
    1.1_识别请求针对的项目部分: 25
    1.2_理解请求目的和作用: 0
    1.3_workspace归属: 25
    1.4_对话流感知与策略匹配: 50
  结果预期:
    1.1_产出可消费性: 40
    1.2_执行完整性与自检: 60
  任务规划:
    1.1_路线效率: 60
    1.2_工具选择: 40


