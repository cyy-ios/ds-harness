# Capability weights.
# Overall score = sum(capability score * weight) / sum(weights).
# If a capability is legally unscored, exclude it from the denominator.

weights:
  真实性&可靠性: 20
  指令遵循: 15
  任务完成度: 15
  项目理解: 10
  用户意图理解: 10
  任务规划: 10
  结果预期: 10
  异常分析能力: 10

