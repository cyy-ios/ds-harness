# 能力权重配置 —— 修改值即可调整总分计算
# 总分 = Σ(能力得分 × 权重) / Σ权重
# 若某项能力未评分，该项不计入总分

weights:
  真实性&可靠性: 20
  指令遵循: 15
  任务完成度: 15
  项目理解: 10
  用户意图理解: 10
  任务规划: 10
  结果预期: 10
  异常分析能力: 10

# 子维度权重（维度间汇总）
# 项目理解: 维度1（仅首轮）+ 维度2（非首轮逐轮均值）
# 指令遵循: 持久规则 + 单次指令
sub_dimension_weights:
  项目理解:
    维度1_初始主动理解: 30
    维度2_动态更新: 70
  指令遵循:
    持久规则: 40
    单次指令: 60

# 子项权重（维度内各小点汇总，每维度内权重之和应为 100）
sub_item_weights:
  项目理解:
    维度1_初始主动理解:
      1.1_首轮探索深度: 100
      1.2_目的理解: 0
      1.3_子项目识别: 0
      1.5_完成度判断: 0
      1.6_项目类型: 0
    维度2_动态更新:
      2.1_环节追踪: 25
      2.2_主支线识别: 25
      2.3_废弃方向识别: 20
      2.4_完成研究中区分: 15
      2.5_无关任务隔离: 15
  用户意图理解:
    1.1_识别请求针对的项目部分: 25
    1.2_理解请求的目的和对项目的作用: 0
    1.3_workspace归属: 25
    1.4_对话流感知与策略匹配: 50
  结果预期:
    1.1_产出可消费性: 40
    1.2_执行完整性与自检: 60
  任务规划:
    1.1_路线效率: 60
    1.2_工具选择: 40
  指令遵循:
    持久规则:
      cosplay: 50
      concise: 50
  真实性&可靠性:
    1.1_信息真实性: 35
    1.2_言行一致性: 30
    1.3_知识依据与验证: 35
